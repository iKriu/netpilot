<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0C111B">
  <title>NetPilot</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%233A56F5'/><path d='M9 22V10l14 12V10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    // Выбрано оформление Material 3 Expressive — его отдаёт /m3/.
    try {
      var d = JSON.parse(localStorage.getItem('np-design') || '{}');
      if (d.design === 'm3') location.replace('/m3/' + location.hash);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="shell" hidden>
    <nav class="side" id="side" aria-label="Разделы"></nav>
    <header class="top" id="top"></header>
    <main id="page"></main>
    <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
  </div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
