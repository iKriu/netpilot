services:
  netpilot:
    build: .
    image: netpilot:latest
    container_name: netpilot
    restart: unless-stopped
    ports:
      - "2017:2017" # веб-интерфейс
      # HTTP/SOCKS5 прокси БЕЗ авторизации. Docker публикует порт в обход файрвола
      # хоста (ufw/firewalld его не закрывают), поэтому прокси доступен всем, кто
      # достучится до этой машины. По умолчанию — для устройств локальной сети;
      # если машина смотрит в интернет или прокси нужен только ей самой, замените на
      #   - "127.0.0.1:7890:7890"
      # или на конкретный адрес в локальной сети, например "192.168.1.10:7890:7890".
      - "7890:7890"
    volumes:
      - ./data:/data
    environment:
      # Пароль веб-интерфейса (логин admin). Если пусто, первую настройку с другого
      # компьютера подтверждает одноразовый код, который печатается в журнал
      # контейнера:  docker compose logs netpilot
      - NETPILOT_PASSWORD=
