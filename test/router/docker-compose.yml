# Стенд режима роутера: «провайдер» (PPPoE, DHCP, NAT) → NetPilot → клиент.
#
#   docker compose -f test/router/docker-compose.yml up -d --build
#   powershell -File test/router/run.ps1
name: netpilot-router-lab

networks:
  # Сеть управления: через неё открывается панель. На WAN-порту адреса меняет
  # DHCP-клиент провайдера, и служебный адрес Docker там не выживает.
  mgmt:
    ipam:
      config:
        - subnet: 10.77.0.0/24
  isp:
    ipam:
      config:
        - subnet: 10.99.0.0/24
  lan:
    ipam:
      config:
        - subnet: 10.88.0.0/24

services:
  isp:
    image: alpine:3.22
    privileged: true # PPPoE-сервер: /dev/ppp, NAT, пересылка
    networks:
      default: {}
      isp:
        ipv4_address: 10.99.0.2
    volumes:
      - ./isp.sh:/isp.sh:ro
    command: sh /isp.sh

  router:
    build: ../..
    image: netpilot:latest
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - /dev/ppp
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - NETPILOT_SCAN=0
      - NETPILOT_ASSUME_LAN=1
      - NETPILOT_PASSWORD=lab-test-password # только для стенда
      - NETPILOT_ROUTER_CONFIRM_SECONDS=15   # короткий срок подтверждения для проверки отката
    ports:
      - "2020:2017"
    networks:
      mgmt:
        ipv4_address: 10.77.0.2
        gw_priority: 100 # проброс порта панели идёт через эту сеть
      isp:
        ipv4_address: 10.99.0.3
      lan:
        ipv4_address: 10.88.0.2

  client:
    image: alpine:3.22
    cap_add: [NET_ADMIN]
    networks:
      lan:
        ipv4_address: 10.88.0.50
    command: sh -c "apk add --no-cache curl >/dev/null && touch /ready && sleep infinity"
